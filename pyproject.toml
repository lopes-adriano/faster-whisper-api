[project]
name = "faster-whisper-api"
version = "0.1.0"
description = "Local audio transcription API and web UI powered by faster-whisper (small model)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av<19",
    "fastapi>=0.163.0",
    "faster-whisper>=1.2.1",
    "onnx-asr>=0.12.0",
    "python-multipart>=0.0.33",
    "sherpa-onnx>=2.0.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
